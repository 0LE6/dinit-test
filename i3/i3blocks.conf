separator=false
separator_block_width=9

[separator]
full_text=|
color=#717171

[disk]
label= 
instance=/
command=~/.config/i3/scripts/disk
interval=30

[memory]
label= 
command=~/.config/i3/scripts/memory
interval=2

[cpu_usage]
label= 
command=~/.config/i3/scripts/cpu_usage
interval=2

[separator]
full_text=|
color=#717171

[CPU-temperature]
command=~/.config/i3/scripts/temperature
interval=30

[battery]
command=~/.config/i3/scripts/battery
interval=30
markup=pango

[separator]
full_text=|
color=#717171

[volume]
command=~/.config/i3/scripts/volume
interval=2

[pavucontrol]
full_text=♪
command=if [ "${button:-${BLOCK_BUTTON:-}}" = 1 ]; then pavucontrol >/dev/null 2>&1 & fi

[separator]
full_text=|
color=#717171

[ppd_menu]
full_text=
command=if [ "${button:-${BLOCK_BUTTON:-}}" = 1 ]; then ~/.config/i3/scripts/power-profiles >/dev/null 2>&1 & fi
color=#407437

[ppd-status]
command=~/.config/i3/scripts/ppd-status
interval=5

[separator]
full_text=|
color=#717171

[time]
command=~/.config/i3/scripts/calendar
DATEFMT=+%a %d %b %H:%M:%S
HEIGHT=180
WIDTH=220
interval=1

[separator]
full_text=|
color=#717171

[bluetooth]
command=~/.config/i3/scripts/bluetooth
interval=5

[network]
command=~/.config/i3/scripts/network
interval=5

[shutdown_menu]
full_text= 
command=if [ "${button:-${BLOCK_BUTTON:-}}" = 1 ]; then ~/.config/i3/scripts/powermenu >/dev/null 2>&1 & fi
